<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>لوحة تحكم — Multi Tabs Controller</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div id="loginScreen" class="screen">
    <form id="loginForm" class="card login-card">
      <div class="brand">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v6c0 5 3.8 8.4 9 9 5.2-.6 9-4 9-9V7l-9-5z" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5ca8"/></linearGradient></defs></svg>
        <h1>لوحة التحكم</h1>
      </div>
      <p class="sub">سجّل دخولك لإدارة الأكواد والصلاحيات</p>
      <label>اسم المستخدم<input id="u" autocomplete="username" required /></label>
      <label>كلمة المرور<input id="p" type="password" autocomplete="current-password" required /></label>
      <button type="submit">دخول</button>
      <div id="loginErr" class="err"></div>
    </form>
  </div>

  <div id="dash" class="screen hidden">
    <aside class="side">
      <div class="brand small">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 2L3 7v6c0 5 3.8 8.4 9 9 5.2-.6 9-4 9-9V7l-9-5z" fill="url(#g2)"/><defs><linearGradient id="g2" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#7c5cff"/><stop offset="1" stop-color="#ff5ca8"/></linearGradient></defs></svg>
        <span>MTC Admin</span>
      </div>
      <nav>
        <button class="navBtn active" data-tab="codes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12h.01M11 12h2"/></svg>
          الأكواد
        </button>
        <button class="navBtn" data-tab="logs">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 13h8M8 17h5"/></svg>
          السجل
        </button>
        <button class="navBtn" data-tab="stats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          إحصائيات
        </button>
      </nav>
      <button id="logoutBtn" class="ghost">خروج</button>
    </aside>

    <main>
      <section id="tab-codes" class="tab active">
        <div class="headerRow">
          <h2>أكواد الدخول</h2>
          <button id="newCodeBtn" class="primary">+ كود جديد</button>
        </div>
        <div id="codesTableWrap"></div>
      </section>

      <section id="tab-logs" class="tab">
        <h2>سجل الدخول</h2>
        <div id="logsTableWrap"></div>
      </section>

      <section id="tab-stats" class="tab">
        <h2>إحصائيات</h2>
        <div id="statsGrid" class="statsGrid"></div>
      </section>
    </main>
  </div>

  <div id="codeModal" class="modal hidden">
    <div class="modalCard card">
      <h3 id="modalTitle">كود جديد</h3>
      <label>الكود (اتركه فارغ ليتولّد تلقائيًا)<input id="f_code" placeholder="تلقائي" /></label>
      <label>المدة (أيام، 0 = بلا انتهاء)<input id="f_duration" type="number" value="30" /></label>
      <label>أقصى عدد أجهزة<input id="f_maxDevices" type="number" value="1" /></label>
      <label>ملاحظة<input id="f_note" placeholder="اسم العميل مثلاً" /></label>
      <fieldset id="f_perms" class="perms"></fieldset>
      <div class="modalActions">
        <button id="modalCancel" class="ghost">إلغاء</button>
        <button id="modalSave" class="primary">حفظ</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
